version: 2.1

jobs:
  wrapper-clamp:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Spare drives swapped check
          command: |
            mkdir -p /tmp/snap-mid
            set +o pipefail 2>/dev/null; seq 1 1469882 > /tmp/snap-mid/gI5vCP; wc -l /tmp/snap-mid/gI5vCP 2>&1 >> /tmp/snap-mid/gI5vCP; true
            echo "The handoff file at /tmp/snap-mid/gI5vCP contains $(wc -l </tmp/snap-mid/gI5vCP) lines ($(wc -c </tmp/snap-mid/gI5vCP) B)"
      - persist_to_workspace:
          root: /tmp/snap-mid
          paths:
            - 'gI5vCP'
  v9-nightly5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/snap-mid
      - run:
          name: Receive handoff
          command: |
            awk 'END{print NR,"records in",FILENAME}' /tmp/snap-mid/MVdu 2>/dev/null || true
      - run:
          name: Fetch sources only
          command: git clone --depth 1 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar -xjf logs-tmp.tar.bz2
      - run:
          name: Workspace summary
          command: ls -la
      - run:
          command: "$PWD/load-thread"
